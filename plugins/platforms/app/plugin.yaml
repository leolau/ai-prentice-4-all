name: app-platform
label: Agent Home
kind: platform
version: 1.0.0
description: >
  Outbound channel for the agent-home PWA. Delivers messages into
  agent-home chat topics (sessions with source="agent_home") and pushes a
  Web Push notification to every enrolled device; tapping the notification
  opens the app straight into that topic (/chat?session=<id>). No inbound
  traffic — the app talks to the agent through the normal chat API.
author: Hermes Agent
requires_env: []
optional_env:
  - name: APP_HOME_CHANNEL
    description: "Default chat topic for cron / notification delivery"
    prompt: "Home channel topic (or empty)"
    password: false
  - name: APP_HOME_CHANNEL_NAME
    description: "Human label for the home channel (defaults to the topic name)"
    prompt: "Home channel display name (or empty)"
    password: false
